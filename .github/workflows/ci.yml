name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# No repository secrets are consumed by CI. The build runs without real
# credentials on purpose: nothing in the scaffold may require a secret to
# compile, and a missing secret must never be filled in with a placeholder.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` (not `npm install`) fails if package.json and the lockfile
      # disagree — that is the install-integrity check.
      - name: Install dependencies (lockfile integrity)
        run: npm ci

      - name: Verify dependency tree
        run: npm ls

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Source data validators
        run: npm run validate:sources

      - name: Validator tooling tests
        run: npm run test:scripts

      # Connection-routing/pooling invariants. Deliberately Docker-free and
      # offline: CI never starts a database or touches a hosted project.
      - name: Database configuration check
        run: npm run check:db-config

      - name: Secret scan
        run: npm run scan:secrets

      - name: Production build
        run: npm run build

      # Belt-and-braces: the built output must not contain a server-only
      # value. Client bundles are inspected for the server env var names
      # that must never be inlined into browser JavaScript.
      - name: Assert no server secrets in build output
        run: npm run scan:build-output

  # Runbook Step 39 — cross-product E2E and accessibility (Playwright/axe).
  # A separate job from `verify`: it starts a real dev server
  # (`playwright.config.ts`'s `webServer`) and downloads a Chromium binary,
  # both real friction `verify`'s fast local checks deliberately avoid.
  # `webServer.env` supplies only local-only, non-secret test values
  # (arbitrary SESSION_SECRET/CRON_SECRET strings, feature flags, dev-only
  # STAFF_DEV_ACCOUNTS) — no repository secret, consistent with this file's
  # own standing rule.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E/accessibility matrix
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
