# Supabase local development configuration (Runbook Step 7).
#
# This file configures the LOCAL stack only. It contains no credentials and is
# not linked to any hosted project — linking dev/staging/production is a
# separate, human-run step documented in docs/database-environments.md.
#
# Schema and migrations are deliberately absent: they arrive in Step 8+.
#
# Ports use the 553xx block rather than the Supabase CLI's 543xx defaults.
# Windows reserves dynamic TCP ranges for Hyper-V/WSL, and on a real dev
# machine here the reserved range 54299-54398 swallowed the CLI's entire
# default block (54320-54329), so `supabase start` failed with "ports are
# not available: ... bind: An attempt was made to access a socket in a way
# forbidden by its access permissions" while still exiting 0. Confirmed
# with `netsh interface ipv4 show excludedportrange protocol=tcp`, not
# guessed. These reservations are dynamic, so the range can appear on any
# Windows machine at any reboot; 553xx sits outside every reserved range
# observed. Local development only -- no hosted environment reads this.

project_id = "cladium-cafe-resort"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Bounded so an unfiltered query cannot pull an unbounded result set.
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
# Must match the hosted project's Postgres major version. Verify against the
# real project before the first remote migration and correct this if it differs.
major_version = 17

[db.pooler]
enabled = true
port = 55329
# Transaction pooling is what serverless application traffic uses
# (production-architecture-v2.md §13). Migrations must NOT go through it —
# they use the direct connection instead. See DIRECT_DATABASE_URL.
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 55323

# Local mail catcher for auth flows. Never a real mail provider in local dev.
# (Was [inbucket]; the CLI deprecated that section name in favour of [local_smtp].)
[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are provisioned by an owner/manager, never self-registered.
# Guests are never Supabase Auth users — they hold an opaque session instead
# (data-model-v2.md §3).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[auth.mfa]
# Owner/manager MFA is *enforced* in Step 10 (RLS/roles) and in the deployment
# policy. Enabling the factor here only makes enrolment possible locally.
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
